services:
  mysql:
    container_name: mangaverse-mysql
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Akuma-no-mi-store
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 10

  php:
    container_name: mangaverse-php
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_URL: ${APP_URL:-http://localhost}
      SANCTUM_STATEFUL_DOMAINS: localhost,127.0.0.1,localhost:8000,127.0.0.1:8000,localhost:5173,127.0.0.1:5173
    volumes:
      - .:/app
      - php_vendor:/app/vendor
      - ./storage/app/public:/app/storage/app/public
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    container_name: mangaverse-frontend
    build:
      context: ./front
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    expose:
      - "80"

  proxy:
    container_name: mangaverse-proxy
    build: ./proxy
    depends_on:
      php:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"

volumes:
  mysql_data:
  php_vendor:
