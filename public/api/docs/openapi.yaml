  responses:
    '401':
      description: Sessão ausente ou expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    '403':
      description: Sem permissão para a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Acesso restrito ao administrador.
    '404':
      description: Registro não encontrado ou fora do escopo da conta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Not Found
    '409':
      description: Conflito com o estado atual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Transição de status do pedido inválida.
    '419':
      description: Cookie/token CSRF ausente, incorreto ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: CSRF token mismatch.
    '429':
      description: Limite de tentativas de login excedido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.
    '422':
      description: Validação de campos ou regra de negócio não atendida.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/ValidationError'
            - $ref: '#/components/schemas/Error'
          examples:
            validacao:
              value:
                message: The quantity field must be at least 0.
                errors:
                  quantity:
                  - The quantity field must be at least 0.
            negocio:
              value:
                message: A quantidade solicitada é maior que o estoque disponível.
