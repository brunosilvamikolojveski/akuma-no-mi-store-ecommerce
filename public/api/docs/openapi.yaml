openapi: 3.0.3
info:
  title: Mangáverse API
  version: 1.0.0
  description: 'API Laravel com sessão/cookies do Sanctum. Use POST /api/auth/login com uma conta do README; a UI
    mantém os cookies e envia CSRF automaticamente antes de operações de escrita. Não existe autenticação Bearer.
    Exemplos usam IDs ilustrativos: consulte as listagens e substitua pelos IDs do seu banco. Os exemplos inválidos
    demonstram respostas 422. Pedidos e pagamentos são fictícios, mas as operações alteram o banco. Respostas de
    erro podem conter detalhes adicionais com APP_DEBUG=true.'
servers:
- url: /
  description: Mesmo host da documentação, pelo proxy ou pela API.
tags:
- name: Sessão e CSRF
- name: Autenticação
- name: Perfil
- name: Catálogo
- name: Carrinho
- name: Endereços
- name: Pedidos
- name: Admin · Mangás
- name: Admin · Categorias
- name: Admin · Autores
- name: Admin · Séries
- name: Admin · Pedidos
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
      - Sessão e CSRF
      summary: Obter cookies de sessão e CSRF
      description: 'Acesso: Público. O navegador armazena XSRF-TOKEN e o cookie de sessão. A UI faz esta chamada
        automaticamente antes de cada escrita. Não retorna JSON.'
      operationId: get_sanctum_csrf_cookie
      responses:
        '204':
          description: Operação concluída.
  /api/auth/register:
    post:
      tags:
      - Autenticação
      summary: Cadastrar cliente e iniciar sessão
      description: 'Acesso: Público. Sempre cria papel customer. Funde o carrinho de visitante e regenera a sessão.
        Campos cart_merge mostram ajustes e itens não transferidos.'
      operationId: post_api_auth_register
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  name: Novo Cliente
                  email: novo@mangaverse.test
                  password: SenhaDeTeste123!
                  password_confirmation: SenhaDeTeste123!
              invalido:
                summary: Entrada inválida para demonstrar a resposta 422.
                value:
                  name: ''
                  email: email-invalido
                  password: '123'
                  password_confirmation: diferente
  /api/auth/login:
    post:
      tags:
      - Autenticação
      summary: Entrar com e-mail e senha
      description: 'Acesso: Público. Até cinco tentativas por minuto. Não emite token Bearer. Funde carrinhos somando
        quantidades até o estoque, descarta o carrinho visitante e regenera a sessão.'
      operationId: post_api_auth_login
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  email: cliente1@mangaverse.test
                  password: cliente123
              invalido:
                summary: Entrada inválida para demonstrar a resposta 422.
                value:
                  email: email-invalido
                  password: ''
  /api/auth/logout:
    post:
      tags:
      - Autenticação
      summary: Sair e invalidar a sessão
      description: 'Acesso: Autenticado. '
      operationId: post_api_auth_logout
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sessão encerrada.
        '401':
          $ref: '#/components/responses/401'
        '419':
          $ref: '#/components/responses/419'
  /api/user:
    get:
      tags:
      - Perfil
      summary: Consultar minha conta
      description: 'Acesso: Autenticado. '
      operationId: get_api_user
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
    patch:
      tags:
      - Perfil
      summary: Atualizar nome e e-mail
      description: 'Acesso: Autenticado. Não altera senha nem papel.'
      operationId: patch_api_user
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  name: Ana Cliente
                  email: cliente1@mangaverse.test
  /api/mangas:
    get:
      tags:
      - Catálogo
      summary: Listar volumes ativos
      description: 'Acesso: Público. Inclui volumes ativos sem estoque. Ordenação padrão: created_at decrescente,
        depois ID decrescente.'
      operationId: get_api_mangas
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Manga'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required:
                - data
                - links
                - meta
        '422':
          $ref: '#/components/responses/422'
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Busca em título do volume, descrição e título da série.
      - name: category
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
          example: aventura
        description: Slug de categoria.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - newest
          - price_asc
          - price_desc
          default: newest
        description: ''
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          example: 12
          minimum: 1
          maximum: 50
        description: 'Padrão: 12.'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          example: 1
          minimum: 1
        description: ''
  /api/mangas/{manga}:
    get:
      tags:
      - Catálogo
      summary: Consultar detalhe de volume ativo
      description: 'Acesso: Público. Volume inexistente ou inativo retorna 404. available_quantity informa o estoque.'
      operationId: get_api_mangas_manga
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MangaDetail'
                required:
                - data
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - name: manga
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
  /api/categories:
    get:
      tags:
      - Catálogo
      summary: Listar categorias
      description: 'Acesso: Público. '
      operationId: get_api_categories
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                required:
                - data
  /api/authors:
    get:
      tags:
      - Catálogo
      summary: Listar autores
      description: 'Acesso: Público. '
      operationId: get_api_authors
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Author'
                required:
                - data
  /api/authors/{author}:
    get:
      tags:
      - Catálogo
      summary: Consultar autor
      description: 'Acesso: Público. '
      operationId: get_api_authors_author
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Author'
                required:
                - data
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - name: author
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
  /api/series:
    get:
      tags:
      - Catálogo
      summary: Listar séries
      description: 'Acesso: Público. Sem paginação. Inclui autores, categorias, editora e contagem de volumes.'
      operationId: get_api_series
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Series'
                required:
                - data
  /api/series/{series}:
    get:
      tags:
      - Catálogo
      summary: Consultar série pelo slug
      description: 'Acesso: Público. '
      operationId: get_api_series_series
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Series'
                required:
                - data
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - name: series
        in: path
        required: true
        schema:
          type: string
          example: one-piece
  /api/cart:
    get:
      tags:
      - Carrinho
      summary: Consultar ou criar carrinho
      description: 'Acesso: Público. Sessão identifica o carrinho visitante; após login, usa o carrinho da conta.
        Totais usam preços atuais do banco. Pode retornar 201 quando cria o carrinho nesta requisição.'
      operationId: get_api_cart
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
                required:
                - data
        '201':
          description: Carrinho criado e retornado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
                required:
                - data
    delete:
      tags:
      - Carrinho
      summary: Esvaziar o carrinho
      description: 'Acesso: Público. '
      operationId: delete_api_cart
      responses:
        '204':
          description: Operação concluída.
        '419':
          $ref: '#/components/responses/419'
  /api/cart/items:
    post:
      tags:
      - Carrinho
      summary: Adicionar volume e somar quantidade
      description: 'Acesso: Público. Sessão identifica o carrinho visitante; após login, usa o carrinho da conta.
        Totais usam preços atuais do banco. Pode retornar 201 quando cria o carrinho nesta requisição.'
      operationId: post_api_cart_items
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
                required:
                - data
        '404':
          $ref: '#/components/responses/404'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
        '201':
          description: Carrinho criado e retornado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
                required:
                - data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  manga_id: 1
                  quantity: 1
              invalido:
                summary: Entrada inválida para demonstrar a resposta 422.
                value:
                  manga_id: 1
                  quantity: 0
  /api/cart/items/{cartItem}:
    patch:
      tags:
      - Carrinho
      summary: Alterar quantidade ou remover com zero
      description: 'Acesso: Público. Sessão identifica o carrinho visitante; após login, usa o carrinho da conta.
        Totais usam preços atuais do banco. Pode retornar 201 quando cria o carrinho nesta requisição.'
      operationId: patch_api_cart_items_cartItem
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
                required:
                - data
        '404':
          $ref: '#/components/responses/404'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
      parameters:
      - name: cartItem
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdate'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  quantity: 2
              invalido:
                summary: Entrada inválida para demonstrar a resposta 422.
                value:
                  quantity: -1
    delete:
      tags:
      - Carrinho
      summary: Remover uma linha do carrinho
      description: 'Acesso: Público. O item deve pertencer ao carrinho atual.'
      operationId: delete_api_cart_items_cartItem
      responses:
        '204':
          description: Operação concluída.
        '404':
          $ref: '#/components/responses/404'
        '419':
          $ref: '#/components/responses/419'
      parameters:
      - name: cartItem
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
  /api/addresses:
    get:
      tags:
      - Endereços
      summary: Listar endereços
      description: 'Acesso: Autenticado. '
      operationId: get_api_addresses
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
    post:
      tags:
      - Endereços
      summary: Cadastrar address
      description: 'Acesso: Autenticado. O primeiro endereço é padrão. Marcar outro como padrão desmarca o anterior.'
      operationId: post_api_addresses
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  label: Principal
                  recipient_name: Ana Cliente
                  postal_code: 80000-000
                  state: PR
                  city: Curitiba
                  neighborhood: Centro
                  street: Rua de Demonstração
                  number: '123'
                  complement: null
                  phone: null
                  is_default: true
              invalido:
                summary: Entrada inválida para demonstrar a resposta 422.
                value:
                  postal_code: '123'
                  state: Paraná
  /api/addresses/{address}:
    get:
      tags:
      - Endereços
      summary: Consultar address
      description: 'Acesso: Autenticado. '
      operationId: get_api_addresses_address
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
    put:
      tags:
      - Endereços
      summary: Atualizar address
      description: 'Acesso: Autenticado. Atualização parcial; somente os campos enviados são alterados.'
      operationId: put_api_addresses_address
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdate'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  label: Casa
                  is_default: true
    patch:
      tags:
      - Endereços
      summary: Atualizar address
      description: 'Acesso: Autenticado. Atualização parcial; somente os campos enviados são alterados.'
      operationId: patch_api_addresses_address
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdate'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  label: Casa
                  is_default: true
    delete:
      tags:
      - Endereços
      summary: Excluir address
      description: 'Acesso: Autenticado. Acesso somente aos próprios endereços. Pedidos mantêm o endereço congelado.
        Se excluir o padrão, o primeiro restante vira padrão.'
      operationId: delete_api_addresses_address
      responses:
        '204':
          description: Operação concluída.
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '419':
          $ref: '#/components/responses/419'
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
  /api/orders:
    get:
      tags:
      - Pedidos
      summary: Listar meus pedidos
      description: 'Acesso: Autenticado. Sem paginação, do ID mais recente ao mais antigo.'
      operationId: get_api_orders
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
    post:
      tags:
      - Pedidos
      summary: Criar pedido a partir do carrinho
      description: 'Acesso: Autenticado. Valida endereço da conta, estoque e disponibilidade. Em transação, congela
        nomes e preços, baixa estoque, cria pagamento pending e esvazia o carrinho. Frete gratuito. Carrinho vazio
        retorna 422; falha de estoque identifica o produto. Valores enviados pelo cliente não definem o total.'
      operationId: post_api_orders
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  address_id: 1
                  payment_method: pix
              invalido:
                summary: Entrada inválida para demonstrar a resposta 422.
                value:
                  address_id: 0
                  payment_method: dinheiro
  /api/orders/{order}:
    get:
      tags:
      - Pedidos
      summary: Consultar meu pedido
      description: 'Acesso: Autenticado. Pedido alheio retorna 404. O admin consulta todos os pedidos na listagem
        administrativa.'
      operationId: get_api_orders_order
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - name: order
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
  /api/orders/{order}/confirm-payment:
    post:
      tags:
      - Pedidos
      summary: Confirmar pagamento simulado
      description: 'Acesso: Autenticado. Somente o dono. Pedido deve estar pending, senão 409. Atualiza pedido e
        pagamento para paid e registra paid_at. Não solicita dados de cartão nem usa gateway.'
      operationId: post_api_orders_order_confirm_payment
      responses:
        '200':
