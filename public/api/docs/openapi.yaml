          type: integer
          example: 1
          minimum: 1
  /api/admin/orders:
    get:
      tags:
      - Admin · Pedidos
      summary: Listar todos os pedidos
      description: 'Acesso: Admin. Sem paginação, do mais recente ao mais antigo.'
      operationId: get_api_admin_orders
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - paid
          - shipped
          - delivered
          - cancelled
        description: ''
  /api/admin/orders/{order}/status:
    patch:
      tags:
      - Admin · Pedidos
      summary: Avançar status ou cancelar pedido
      description: 'Acesso: Admin. Transições permitidas: paid → shipped, shipped → delivered, pending → cancelled.
        Cancelamento devolve estoque. Não permite marcar pedido como pago por esta rota.'
      operationId: patch_api_admin_orders_order_status
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                required:
                - data
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '419':
          $ref: '#/components/responses/419'
        '422':
          $ref: '#/components/responses/422'
      parameters:
      - name: order
        in: path
        required: true
        schema:
          type: integer
          example: 1
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
            examples:
              valido:
                summary: Entrada válida; ajuste os IDs para os dados do banco.
                value:
                  status: shipped
              invalido:
                summary: Entrada inválida para demonstrar a resposta 422.
                value:
                  status: paid
